{% extends 'base.html' %}
{% block menu %}
<a href="/main" class="w3-bar-item w3-button">MAIN</a>
<a href="/register" class="w3-bar-item w3-button">REGISTER</a>
{% endblock %}
{% block content %}
	<div class="w3-row-padding">
		<div class="w3-col m6">
			<fieldset>
				<legend>SCAN</legend>
				<video id="video" autoplay playsinline muted class="w3-border" style="width:100%;max-width:640px"></video>
				<canvas id="canvas" style="display:none"></canvas>
				<div id="result" class="w3-panel w3-border w3-padding-32 w3-center" style="font-size:2em">READY</div>
			</fieldset>
		</div>
		<div class="w3-col m6">
			<fieldset>
				<legend>STUDENT</legend>
				<table class="w3-table-all">
					<tr><td><b>IDNO</b></td><td id="d_idno">—</td></tr>
					<tr><td><b>LASTNAME</b></td><td id="d_lastname">—</td></tr>
					<tr><td><b>FIRSTNAME</b></td><td id="d_firstname">—</td></tr>
					<tr><td><b>COURSE</b></td><td id="d_course">—</td></tr>
					<tr><td><b>LEVEL</b></td><td id="d_level">—</td></tr>
				</table>
			</fieldset>
		</div>
	</div>
	<script src="{{ url_for('static',filename='js/jsqr.min.js') }}"></script>
	<script>
	var video = document.getElementById('video');
	var canvas = document.getElementById('canvas');
	var ctx = canvas.getContext('2d');
	var result = document.getElementById('result');
	var busy = false;
	var paused = false;
	var CAM_MSG = {
		NotAllowedError: 'CAM ERROR: permission blocked',
		NotReadableError: 'CAM ERROR: scrcpy issue'
	};

	function show(color, text){
		result.className = 'w3-panel w3-border w3-padding-32 w3-center ' + color;
		result.style.fontSize = '2em';
		result.textContent = text;
	}

	function tick(){
		if(busy || paused || video.readyState < 2) return;
		canvas.width = video.videoWidth;
		canvas.height = video.videoHeight;
		ctx.drawImage(video, 0, 0);
		var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
		var code = jsQR(img.data, img.width, img.height);
		if(!code) return;
		busy = true;
		fetch('/scan', {
			method: 'POST',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({token: code.data.trim()})
		})
		.then(function(r){ return r.json(); })
		.then(function(d){
			if(d.ok){
				show('w3-green', 'FOUND — ' + d.lastname + ', ' + d.firstname);
				document.getElementById('d_idno').textContent = d.idno;
				document.getElementById('d_lastname').textContent = d.lastname;
				document.getElementById('d_firstname').textContent = d.firstname;
				document.getElementById('d_course').textContent = d.course;
				document.getElementById('d_level').textContent = d.level;
			}
			else show('w3-red', 'UNKNOWN CODE');
			paused = true;
			setTimeout(function(){ paused = false; }, 2000);
		})
		.catch(function(e){ show('w3-red', 'ERROR — ' + e.message); })
		.finally(function(){ busy = false; });
	}

	var started = false;

	function startCamera(){
		navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1280}}})
		.then(function(stream){
			video.srcObject = stream;
			video.play();
			if(!started){
				started = true;
				setInterval(tick, 150);
			}
			navigator.mediaDevices.enumerateDevices()
			.then(function(devices){
				var cam = devices.filter(function(d){ return d.kind === 'videoinput'; })
					.find(function(d){ return (d.label || '').indexOf('PhoneCam') >= 0; });
				if(!cam || !cam.deviceId) return;
				return navigator.mediaDevices.getUserMedia({video: {deviceId: {exact: cam.deviceId}, width: {ideal: 1280}}})
				.then(function(stream2){
					stream.getTracks().forEach(function(t){ t.stop(); });
					video.srcObject = stream2;
					video.play();
				});
			})
			.catch(function(){ /* keep the phase-1 camera */ });
		})
		.catch(function(e){ show('w3-red', CAM_MSG[e.name] || 'CAM ERROR: device cam issue'); });
	}

	startCamera();
	</script>
{% endblock %}
